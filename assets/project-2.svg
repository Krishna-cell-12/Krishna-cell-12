<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" fill="none">
<defs>
<linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0C1E3F"/><stop offset="1" stop-color="#071225"/></linearGradient>
<linearGradient id="line" x1="0" x2="1"><stop offset="0" stop-color="#1F6FEB"/><stop offset="1" stop-color="#1F6FEB" stop-opacity="0"/></linearGradient>
<radialGradient id="glow" cx="0.85" cy="0.05" r="0.9"><stop offset="0" stop-color="#1F6FEB" stop-opacity="0.38"/><stop offset="1" stop-color="#1F6FEB" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" stroke="#1F6FEB" stroke-opacity="0.07"/></pattern>

</defs>
<style>
.serif{font-family:Georgia,'Times New Roman',serif}
.mono{font-family:Consolas,'SFMono-Regular','Courier New',monospace}
.sans{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
.it{font-style:italic}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 40s linear infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.fl{animation:float 5s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(0)}50%{transform:translateX(1100px)}100%{transform:translateX(0)}}
.slide{animation:slide 9s ease-in-out infinite}
@keyframes show{to{opacity:1}}
.ln{opacity:0;animation:show .3s forwards}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.blink{animation:blink 1s steps(1) infinite}
@keyframes drop{0%{transform:translateY(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(150px);opacity:0}}.drop{animation:drop 3s ease-in-out infinite}</style>
<rect x="0" y="0" width="1200" height="310" rx="20" fill="url(#card)"/><rect x="0" y="0" width="1200" height="310" rx="20" fill="url(#glow)"/><rect x="0" y="0" width="1200" height="310" rx="20" fill="url(#grid)"/><rect x="0.5" y="0.5" width="1199" height="309" rx="20" stroke="#1F6FEB" stroke-opacity="0.38"/><text x="50" y="52" class="mono" font-size="11" letter-spacing="3" fill="#58A6FF">02 · AI · SEARCH · RANKING</text><text x="48" y="112" class="serif" font-size="54" fill="#FFFFFF">TalentMatch-AI</text><text x="50" y="146" class="sans" font-size="17" fill="#E6EDF3" fill-opacity=".85">A candidate ranking engine built on semantic search.</text><text x="50" y="176" class="mono" font-size="12" fill="#7D93B2"><tspan fill="#1F6FEB">BUILT ›</tspan> FAISS vector search · all-MiniLM-L6-v2 embeddings · Groq Llama-3.3-70B</text><line x1="50" y1="196" x2="760" y2="196" stroke="#1F6FEB" stroke-opacity=".35"/><text x="50" y="236" class="serif" font-size="34" fill="#FFFFFF">FAISS</text><text x="50" y="256" class="sans" font-size="12" fill="#7D93B2">vector index</text><text x="290" y="236" class="serif" font-size="34" fill="#FFFFFF">MiniLM</text><text x="290" y="256" class="sans" font-size="12" fill="#7D93B2">sentence embeddings</text><text x="530" y="236" class="serif" font-size="34" fill="#FFFFFF">70B</text><text x="530" y="256" class="sans" font-size="12" fill="#7D93B2">Llama-3.3 on Groq</text><rect x="50" y="270" width="66" height="24" rx="12" fill="#0B1F42" stroke="#1F6FEB" stroke-opacity=".5"/><text x="83.0" y="286" text-anchor="middle" class="mono" font-size="11" fill="#A5D6FF">Python</text><rect x="126" y="270" width="59" height="24" rx="12" fill="#0B1F42" stroke="#1F6FEB" stroke-opacity=".5"/><text x="155.5" y="286" text-anchor="middle" class="mono" font-size="11" fill="#A5D6FF">FAISS</text><rect x="195" y="270" width="66" height="24" rx="12" fill="#0B1F42" stroke="#1F6FEB" stroke-opacity=".5"/><text x="228.0" y="286" text-anchor="middle" class="mono" font-size="11" fill="#A5D6FF">MiniLM</text><rect x="271" y="270" width="52" height="24" rx="12" fill="#0B1F42" stroke="#1F6FEB" stroke-opacity=".5"/><text x="297.0" y="286" text-anchor="middle" class="mono" font-size="11" fill="#A5D6FF">Groq</text><rect x="333" y="270" width="87" height="24" rx="12" fill="#0B1F42" stroke="#1F6FEB" stroke-opacity=".5"/><text x="376.5" y="286" text-anchor="middle" class="mono" font-size="11" fill="#A5D6FF">Llama-3.3</text><text x="970" y="38" text-anchor="middle" class="mono" font-size="10" letter-spacing="3" fill="#7D93B2">RANKING PIPELINE</text><rect x="860" y="60" width="220" height="40" rx="10" fill="#08142B" stroke="#58A6FF" stroke-opacity="0.4"/><text x="970" y="85" text-anchor="middle" class="mono" font-size="13" fill="#E6EDF3">Resume / JD text</text><line x1="970" y1="100" x2="970" y2="118" stroke="#1F6FEB" stroke-dasharray="3 3"/><rect x="860" y="118" width="220" height="40" rx="10" fill="#08142B" stroke="#58A6FF" stroke-opacity="0.4"/><text x="970" y="143" text-anchor="middle" class="mono" font-size="13" fill="#E6EDF3">MiniLM embeddings</text><line x1="970" y1="158" x2="970" y2="176" stroke="#1F6FEB" stroke-dasharray="3 3"/><rect x="860" y="176" width="220" height="40" rx="10" fill="#08142B" stroke="#58A6FF" stroke-opacity="0.4"/><text x="970" y="201" text-anchor="middle" class="mono" font-size="13" fill="#E6EDF3">FAISS retrieval</text><line x1="970" y1="216" x2="970" y2="234" stroke="#1F6FEB" stroke-dasharray="3 3"/><rect x="860" y="234" width="220" height="40" rx="10" fill="#08142B" stroke="#58A6FF" stroke-opacity="0.95"/><text x="970" y="259" text-anchor="middle" class="mono" font-size="13" fill="#E6EDF3">Llama-3.3 ranking</text><circle class="drop" cx="970" cy="100" r="4" fill="#A5D6FF"/>
</svg>