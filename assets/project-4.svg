class="mono" font-size="11" fill="#A5D6FF">DFSAR</text><rect x="243" y="270" width="80" height="24" rx="12" fill="#0B1F42" stroke="#1F6FEB" stroke-opacity=".5"/><text x="283.0" y="286" text-anchor="middle" class="mono" font-size="11" fill="#A5D6FF">LOLA PSR</text><text x="970" y="38" text-anchor="middle" class="mono" font-size="10" letter-spacing="3" fill="#7D93B2">ICE PROBABILITY SCAN</text><circle cx="970" cy="150" r="105" stroke="#1F6FEB" stroke-opacity="0.3"/><circle cx="970" cy="150" r="75" stroke="#1F6FEB" stroke-opacity="0.5"/><circle cx="970" cy="150" r="45" stroke="#1F6FEB" stroke-opacity="0.8"/><circle cx="970" cy="150" r="44" fill="#040912"/><path class="sweep" d="M970,150 L970,45 A105,105 0 0 1 1044,76 Z" fill="#58A6FF" fill-opacity=".18"/><circle class="pulse" cx="955" cy="158" r="3" fill="#A5D6FF" style="animation-delay:0.0s"/><circle class="pulse" cx="982" cy="136" r="3" fill="#A5D6FF" style="animation-delay:0.5s"/><circle class="pulse" cx="990" cy="166" r="3" fill="#A5D6FF" style="animation-delay:1.0s"/><circle class="pulse" cx="962" cy="132" r="3" fill="#A5D6FF" style="animation-delay:1.5s"/><circle class="pulse" cx="972" cy="174" r="3" fill="#A5D6FF" style="animation-delay:2.0s"/><text x="970" y="154" text-anchor="middle" class="mono" font-size="10" fill="#7D93B2" opacity=".0">PSR</text><text x="970" y="275" text-anchor="middle" class="mono" font-size="11" letter-spacing="2" fill="#7D93B2">PSR · permanently shadowed region</text>
