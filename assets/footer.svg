lass="pulse" cx="914" cy="126" r="1" fill="#A5D6FF" style="animation-delay:0.13s"/><circle class="pulse" cx="132" cy="116" r="1.5" fill="#A5D6FF" style="animation-delay:1.65s"/><circle class="pulse" cx="611" cy="149" r="1" fill="#A5D6FF" style="animation-delay:3.00s"/><text x="600" y="108" text-anchor="middle" class="serif it" font-size="84" fill="#A5D6FF">Krishna</text><rect x="300" y="130" width="600" height="1.5" fill="#1F6FEB" fill-opacity=".6"/><circle class="slide" cx="300" cy="131" r="3.5" fill="#A5D6FF" style="animation-name:none"/><text x="600" y="165" text-anchor="middle" class="serif it" font-size="22" fill="#E6EDF3">Building software, from the kernel up.</text><text x="600" y="194" text-anchor="middle" class="mono" font-size="11" letter-spacing="4" fill="#7D93B2">FULL-STACK · ML / AI · SYSTEMS</text>
