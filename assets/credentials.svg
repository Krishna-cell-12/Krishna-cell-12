<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" fill="none">
<defs>
<linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0C1E3F"/><stop offset="1" stop-color="#071225"/></linearGradient>
<linearGradient id="line" x1="0" x2="1"><stop offset="0" stop-color="#1F6FEB"/><stop offset="1" stop-color="#1F6FEB" stop-opacity="0"/></linearGradient>
<radialGradient id="glow" cx="0.85" cy="0.05" r="0.9"><stop offset="0" stop-color="#1F6FEB" stop-opacity="0.38"/><stop offset="1" stop-color="#1F6FEB" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" stroke="#1F6FEB" stroke-opacity="0.07"/></pattern>

</defs>
<style>
.serif{font-family:Georgia,'Times New Roman',serif}
.mono{font-family:Consolas,'SFMono-Regular','Courier New',monospace}
.sans{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
.it{font-style:italic}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 40s linear infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.fl{animation:float 5s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(0)}50%{transform:translateX(1100px)}100%{transform:translateX(0)}}
.slide{animation:slide 9s ease-in-out infinite}
@keyframes show{to{opacity:1}}
.ln{opacity:0;animation:show .3s forwards}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.blink{animation:blink 1s steps(1) infinite}
</style>
<rect x="0" y="0" width="1200" height="220" rx="20" fill="url(#card)"/><rect x="0" y="0" width="1200" height="220" rx="20" fill="url(#glow)"/><rect x="0.5" y="0.5" width="1199" height="219" rx="20" stroke="#1F6FEB" stroke-opacity="0.38"/><rect x="36" y="30" width="552" height="160" rx="14" fill="#07142B" stroke="#58A6FF" stroke-opacity=".45"/><text x="60" y="62" class="mono" font-size="10" letter-spacing="3" fill="#58A6FF">ORACLE</text><circle class="pulse" cx="556" cy="58" r="3.5" fill="#A5D6FF"/><line x1="60" y1="76" x2="564" y2="76" stroke="#1F6FEB" stroke-opacity=".3"/><text x="60" y="118" class="serif" font-size="28" fill="#FFFFFF">Java Foundations Associate</text><text x="60" y="146" class="sans" font-size="14" fill="#7D93B2">Oracle Certified Foundations Associate</text><text x="60" y="172" class="mono" font-size="10" letter-spacing="3" fill="#A5D6FF" fill-opacity=".8">ISSUED JUL 2026</text><rect x="606" y="30" width="552" height="160" rx="14" fill="#07142B" stroke="#58A6FF" stroke-opacity=".45"/><text x="630" y="62" class="mono" font-size="10" letter-spacing="3" fill="#58A6FF">DATABASES</text><circle class="pulse" cx="1126" cy="58" r="3.5" fill="#A5D6FF"/><line x1="630" y1="76" x2="1134" y2="76" stroke="#1F6FEB" stroke-opacity=".3"/><text x="630" y="118" class="serif" font-size="28" fill="#FFFFFF">MongoDB Database Administration</text><text x="630" y="146" class="sans" font-size="14" fill="#7D93B2">Completed certification</text><text x="630" y="172" class="mono" font-size="10" letter-spacing="3" fill="#A5D6FF" fill-opacity=".8">COMPLETED</text>
</svg>