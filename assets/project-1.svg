font-size="11" fill="#A5D6FF">Docker</text><rect x="313" y="270" width="94" height="24" rx="12" fill="#0B1F42" stroke="#1F6FEB" stroke-opacity=".5"/><text x="360.0" y="286" text-anchor="middle" class="mono" font-size="11" fill="#A5D6FF">Gemini API</text><rect x="417" y="270" width="73" height="24" rx="12" fill="#0B1F42" stroke="#1F6FEB" stroke-opacity=".5"/><text x="453.5" y="286" text-anchor="middle" class="mono" font-size="11" fill="#A5D6FF">Polygon</text><text x="970" y="38" text-anchor="middle" class="mono" font-size="10" letter-spacing="3" fill="#7D93B2">SCAN PIPELINE</text><rect x="860" y="60" width="220" height="40" rx="10" fill="#08142B" stroke="#58A6FF" stroke-opacity="0.4"/><text x="970" y="85" text-anchor="middle" class="mono" font-size="13" fill="#E6EDF3">GitHub repo</text><line x1="970" y1="100" x2="970" y2="118" stroke="#1F6FEB" stroke-dasharray="3 3"/><rect x="860" y="118" width="220" height="40" rx="10" fill="#08142B" stroke="#58A6FF" stroke-opacity="0.4"/><text x="970" y="143" text-anchor="middle" class="mono" font-size="13" fill="#E6EDF3">Semgrep + TruffleHog</text><line x1="970" y1="158" x2="970" y2="176" stroke="#1F6FEB" stroke-dasharray="3 3"/><rect x="860" y="176" width="220" height="40" rx="10" fill="#08142B" stroke="#58A6FF" stroke-opacity="0.4"/><text x="970" y="201" text-anchor="middle" class="mono" font-size="13" fill="#E6EDF3">Gemini analysis</text><line x1="970" y1="216" x2="970" y2="234" stroke="#1F6FEB" stroke-dasharray="3 3"/><rect x="860" y="234" width="220" height="40" rx="10" fill="#08142B" stroke="#58A6FF" stroke-opacity="0.95"/><text x="970" y="259" text-anchor="middle" class="mono" font-size="13" fill="#E6EDF3">Polygon record</text><circle class="drop" cx="970" cy="100" r="4" fill="#A5D6FF"/>
</svg>