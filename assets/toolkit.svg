<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" fill="none">
<defs>
<linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0C1E3F"/><stop offset="1" stop-color="#071225"/></linearGradient>
<linearGradient id="line" x1="0" x2="1"><stop offset="0" stop-color="#1F6FEB"/><stop offset="1" stop-color="#1F6FEB" stop-opacity="0"/></linearGradient>
<radialGradient id="glow" cx="0.85" cy="0.05" r="0.9"><stop offset="0" stop-color="#1F6FEB" stop-opacity="0.38"/><stop offset="1" stop-color="#1F6FEB" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" stroke="#1F6FEB" stroke-opacity="0.07"/></pattern>

</defs>
<style>
.serif{font-family:Georgia,'Times New Roman',serif}
.mono{font-family:Consolas,'SFMono-Regular','Courier New',monospace}
.sans{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
.it{font-style:italic}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 40s linear infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.fl{animation:float 5s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(0)}50%{transform:translateX(1100px)}100%{transform:translateX(0)}}
.slide{animation:slide 9s ease-in-out infinite}
@keyframes show{to{opacity:1}}
.ln{opacity:0;animation:show .3s forwards}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.blink{animation:blink 1s steps(1) infinite}
</style>
<rect x="0" y="0" width="1200" height="440" rx="20" fill="url(#card)"/><rect x="0" y="0" width="1200" height="440" rx="20" fill="url(#glow)"/><rect x="0.5" y="0.5" width="1199" height="439" rx="20" stroke="#1F6FEB" stroke-opacity="0.38"/><rect x="36" y="30" width="360" height="180" rx="14" fill="#07142B" stroke="#1F6FEB" stroke-opacity=".35"/><text x="60" y="64" class="mono" font-size="10" letter-spacing="3" fill="#58A6FF">01  LANGUAGES</text><text x="60" y="118" class="serif" font-size="38" fill="#FFFFFF">Java</text><text x="60" y="154" class="serif" font-size="21" fill="#A5D6FF" fill-opacity=".85">Python</text><text x="60" y="184" class="sans" font-size="13" fill="#7D93B2">C · x86 ASM · TypeScript · JavaScript</text><circle class="pulse" cx="372" cy="60" r="3" fill="#58A6FF" style="animation-delay:0.0s"/><rect x="416" y="30" width="360" height="180" rx="14" fill="#07142B" stroke="#1F6FEB" stroke-opacity=".35"/><text x="440" y="64" class="mono" font-size="10" letter-spacing="3" fill="#58A6FF">02  AI · ML</text><text x="440" y="118" class="serif" font-size="38" fill="#FFFFFF">ML &amp; Embeddings</text><text x="440" y="154" class="serif" font-size="21" fill="#A5D6FF" fill-opacity=".85">DBSCAN · Random Forest</text><text x="440" y="184" class="sans" font-size="13" fill="#7D93B2">FAISS · Gemini API · Groq</text><circle class="pulse" cx="752" cy="60" r="3" fill="#58A6FF" style="animation-delay:0.3s"/><rect x="796" y="30" width="360" height="180" rx="14" fill="#07142B" stroke="#1F6FEB" stroke-opacity=".35"/><text x="820" y="64" class="mono" font-size="10" letter-spacing="3" fill="#58A6FF">03  FRONTEND</text><text x="820" y="118" class="serif" font-size="38" fill="#FFFFFF">React</text><text x="820" y="154" class="serif" font-size="21" fill="#A5D6FF" fill-opacity=".85">Next.js · TypeScript</text><text x="820" y="184" class="sans" font-size="13" fill="#7D93B2">Tailwind · Framer Motion · Zustand</text><circle class="pulse" cx="1132" cy="60" r="3" fill="#58A6FF" style="animation-delay:0.6s"/><rect x="36" y="230" width="360" height="180" rx="14" fill="#07142B" stroke="#1F6FEB" stroke-opacity=".35"/><text x="60" y="264" class="mono" font-size="10" letter-spacing="3" fill="#58A6FF">04  BACKEND &amp; APIS</text><text x="60" y="318" class="serif" font-size="38" fill="#FFFFFF">Node.js</text><text x="60" y="354" class="serif" font-size="21" fill="#A5D6FF" fill-opacity=".85">FastAPI · Spring Boot</text><text x="60" y="384" class="sans" font-size="13" fill="#7D93B2">REST APIs · Express</text><circle class="pulse" cx="372" cy="260" r="3" fill="#58A6FF" style="animation-delay:0.8999999999999999s"/><rect x="416" y="230" width="360" height="180" rx="14" fill="#07142B" stroke="#1F6FEB" stroke-opacity=".35"/><text x="440" y="264" class="mono" font-size="10" letter-spacing="3" fill="#58A6FF">05  DATA &amp; INFRA</text><text x="440" y="318" class="serif" font-size="38" fill="#FFFFFF">MongoDB</text><text x="440" y="354" class="serif" font-size="21" fill="#A5D6FF" fill-opacity=".85">Docker · AWS EC2</text><text x="440" y="384" class="sans" font-size="13" fill="#7D93B2">Polygon blockchain</text><circle class="pulse" cx="752" cy="260" r="3" fill="#58A6FF" style="animation-delay:1.2s"/><rect x="796" y="230" width="360" height="180" rx="14" fill="#07142B" stroke="#1F6FEB" stroke-opacity=".35"/><text x="820" y="264" class="mono" font-size="10" letter-spacing="3" fill="#58A6FF">06  TOOLS &amp; SYSTEMS</text><text x="820" y="318" class="serif" font-size="38" fill="#FFFFFF">Git · GitHub</text><text x="820" y="354" class="serif" font-size="21" fill="#A5D6FF" fill-opacity=".85">QEMU · Semgrep</text><text x="820" y="384" class="sans" font-size="13" fill="#7D93B2">Satellite / remote sensing data</text><circle class="pulse" cx="1132" cy="260" r="3" fill="#58A6FF" style="animation-delay:1.5s"/>
