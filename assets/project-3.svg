<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" fill="none">
<defs>
<linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0C1E3F"/><stop offset="1" stop-color="#071225"/></linearGradient>
<linearGradient id="line" x1="0" x2="1"><stop offset="0" stop-color="#1F6FEB"/><stop offset="1" stop-color="#1F6FEB" stop-opacity="0"/></linearGradient>
<radialGradient id="glow" cx="0.85" cy="0.05" r="0.9"><stop offset="0" stop-color="#1F6FEB" stop-opacity="0.38"/><stop offset="1" stop-color="#1F6FEB" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" stroke="#1F6FEB" stroke-opacity="0.07"/></pattern>

</defs>
<style>
.serif{font-family:Georgia,'Times New Roman',serif}
.mono{font-family:Consolas,'SFMono-Regular','Courier New',monospace}
.sans{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
.it{font-style:italic}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 40s linear infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.fl{animation:float 5s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(0)}50%{transform:translateX(1100px)}100%{transform:translateX(0)}}
.slide{animation:slide 9s ease-in-out infinite}
@keyframes show{to{opacity:1}}
.ln{opacity:0;animation:show .3s forwards}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.blink{animation:blink 1s steps(1) infinite}
</style>
<rect x="0" y="0" width="1200" height="310" rx="20" fill="url(#card)"/><rect x="0" y="0" width="1200" height="310" rx="20" fill="url(#glow)"/><rect x="0" y="0" width="1200" height="310" rx="20" fill="url(#grid)"/><rect x="0.5" y="0.5" width="1199" height="309" rx="20" stroke="#1F6FEB" stroke-opacity="0.38"/><text x="50" y="52" class="mono" font-size="11" letter-spacing="3" fill="#58A6FF">03 · SYSTEMS · LOW-LEVEL</text><text x="48" y="112" class="serif" font-size="54" fill="#FFFFFF">Custom OS Kernel</text><text x="50" y="146" class="sans" font-size="17" fill="#E6EDF3" fill-opacity=".85">An operating-system kernel written from scratch.</text><text x="50" y="176" class="mono" font-size="12" fill="#7D93B2"><tspan fill="#1F6FEB">BUILT ›</tspan> GDT / IDT setup in C and x86 Assembly · tested in QEMU</text><line x1="50" y1="196" x2="760" y2="196" stroke="#1F6FEB" stroke-opacity=".35"/><text x="50" y="236" class="serif" font-size="34" fill="#FFFFFF">C + ASM</text><text x="50" y="256" class="sans" font-size="12" fill="#7D93B2">implementation</text><text x="290" y="236" class="serif" font-size="34" fill="#FFFFFF">GDT/IDT</text><text x="290" y="256" class="sans" font-size="12" fill="#7D93B2">descriptor tables</text><text x="530" y="236" class="serif" font-size="34" fill="#FFFFFF">QEMU</text><text x="530" y="256" class="sans" font-size="12" fill="#7D93B2">emulated hardware</text><rect x="50" y="270" width="31" height="24" rx="12" fill="#0B1F42" stroke="#1F6FEB" stroke-opacity=".5"/><text x="65.5" y="286" text-anchor="middle" class="mono" font-size="11" fill="#A5D6FF">C</text><rect x="91" y="270" width="108" height="24" rx="12" fill="#0B1F42" stroke="#1F6FEB" stroke-opacity=".5"/><text x="145.0" y="286" text-anchor="middle" class="mono" font-size="11" fill="#A5D6FF">x86 Assembly</text><rect x="209" y="270" width="52" height="24" rx="12" fill="#0B1F42" stroke="#1F6FEB" stroke-opacity=".5"/><text x="235.0" y="286" text-anchor="middle" class="mono" font-size="11" fill="#A5D6FF">QEMU</text><rect x="271" y="270" width="45" height="24" rx="12" fill="#0B1F42" stroke="#1F6FEB" stroke-opacity=".5"/><text x="293.5" y="286" text-anchor="middle" class="mono" font-size="11" fill="#A5D6FF">GDT</text><rect x="326" y="270" width="45" height="24" rx="12" fill="#0B1F42" stroke="#1F6FEB" stroke-opacity=".5"/><text x="348.5" y="286" text-anchor="middle" class="mono" font-size="11" fill="#A5D6FF">IDT</text><text x="970" y="38" text-anchor="middle" class="mono" font-size="10" letter-spacing="3" fill="#7D93B2">KERNEL LAYERS</text><g class="fl" style="animation-delay:0.0s"><polygon points="880,62 1090,62 1070,100 860,100" fill="#08142B" stroke="#58A6FF" stroke-opacity="0.35"/><text x="975" y="86" text-anchor="middle" class="mono" font-size="12" fill="#E6EDF3">bootloader · ASM</text></g><g class="fl" style="animation-delay:0.5s"><polygon points="880,116 1090,116 1070,154 860,154" fill="#08142B" stroke="#58A6FF" stroke-opacity="0.55"/><text x="975" y="140" text-anchor="middle" class="mono" font-size="12" fill="#E6EDF3">GDT</text></g><g class="fl" style="animation-delay:1.0s"><polygon points="880,170 1090,170 1070,208 860,208" fill="#08142B" stroke="#58A6FF" stroke-opacity="0.75"/><text x="975" y="194" text-anchor="middle" class="mono" font-size="12" fill="#E6EDF3">IDT · interrupts</text></g><g class="fl" style="animation-delay:1.5s"><polygon points="880,224 1090,224 1070,262 860,262" fill="#08142B" stroke="#58A6FF" stroke-opacity="0.95"/><text x="975" y="248" text-anchor="middle" class="mono" font-size="12" fill="#E6EDF3">kernel main · C</text></g>
</svg>